version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: product-mgmt-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-product_mgmt}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product-mgmt-backend
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-product_mgmt}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: product-mgmt-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  # Redis（可选，启用后限流将使用共享存储，适用于多实例部署）
  # 启动方式: docker-compose --profile production up -d
  redis:
    image: redis:7-alpine
    container_name: product-mgmt-redis
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  upload_data:
  redis_data:
